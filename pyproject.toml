[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
  # FastAPI intentionally declares dependencies in parameter defaults.
  "B008",
  # Japanese user-facing text intentionally uses full-width punctuation.
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_api.py" = ["E402"]
