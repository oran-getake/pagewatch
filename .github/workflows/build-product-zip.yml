name: Build distribution ZIP

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "product-v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify distribution documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            requirements.txt
            Dockerfile
            ios/project.yml
            sales/BOOTH_LISTING_JA.md
            sales/BUYER_GUIDE_JA.md
            sales/FAQ_JA.md
            sales/COMMERCIAL_LICENSE_JA.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo "Refusing to package a tracked .env file."
            exit 1
          fi

      - name: Create deterministic source archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          product_name="pagewatch"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          archive_name="${product_name}-${safe_ref}-${GITHUB_SHA:0:12}"
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix="${product_name}/" \
            --output="dist/${archive_name}.zip" \
            HEAD \
            -- . \
            ':(exclude).github' \
            ':(exclude).github/**'
          archive_listing="$(unzip -Z1 "dist/${archive_name}.zip")"
          if grep -Eq '(^|/)\.github(/|$)' <<< "$archive_listing"; then
            echo "Refusing to publish an archive containing .github/."
            exit 1
          fi
          unzip -t "dist/${archive_name}.zip"
          (cd dist && sha256sum "${archive_name}.zip" > "${archive_name}.sha256")
          (cd dist && sha256sum --check "${archive_name}.sha256")
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive_name }}
          path: |
            dist/${{ steps.archive.outputs.archive_name }}.zip
            dist/${{ steps.archive.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 30
